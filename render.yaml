services:
  - type: web
    name: ml-scraper
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SENHA_ACESSO
        sync: false  # configure manualmente no painel do Render (secret)
      - key: PYTHON_VERSION
        value: 3.13.1
